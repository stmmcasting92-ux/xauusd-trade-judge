<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08101d">
<link rel="manifest" href="manifest.json">
<title>XAUUSD JUDGE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08101d;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:720px;margin:auto;padding:18px 14px 70px}
h1{margin:0;font-size:25px} .sub{color:#9fb0c9;font-size:12px}
.card{background:#111c2e;border:1px solid #25344d;border-radius:18px;padding:16px;margin:12px 0}
.hero{text-align:center;padding:24px 14px}
.price{font-size:42px;font-weight:850;letter-spacing:.5px;margin:10px 0}
.judge{font-size:34px;font-weight:900;margin:8px 0}
.long{color:#72e6ad} .short{color:#ff7d8b} .wait{color:#f5b942}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tf,.metric{background:#0b1424;border:1px solid #25344d;border-radius:12px;padding:12px}
.tf b{float:right} .up{color:#72e6ad} .down{color:#ff7d8b} .flat{color:#c4cedd}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #25344d}
.row:last-child{border-bottom:0}
.label{color:#9fb0c9}
.reason{line-height:1.55;color:#dbe5f5}
.status{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:12px;color:#9fb0c9;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#24c77a;box-shadow:0 0 10px #24c77a}
.dot.err{background:#ff5c6c;box-shadow:none}
.small{font-size:11px;color:#71839e;margin-top:8px;text-align:center}
</style>
</head>
<body><main>
<h1>XAUUSD JUDGE</h1>
<div class="sub">TradingView → Cloudflare Worker → Live PWA</div>

<div class="card hero">
  <div class="sub">CURRENT PRICE</div>
  <div id="price" class="price">----</div>
  <div id="judge" class="judge wait">WAIT</div>
  <div id="reason" class="reason">データ取得中...</div>
  <div class="status"><span id="dot" class="dot"></span><span id="live">CONNECTING</span></div>
  <div id="updated" class="small"></div>
</div>

<div class="card">
  <div class="sub" style="margin-bottom:10px">MULTI TIMEFRAME</div>
  <div class="grid">
    <div class="tf">4H <b id="h4">--</b></div>
    <div class="tf">1H <b id="h1">--</b></div>
    <div class="tf">15M <b id="m15">--</b></div>
    <div class="tf">5M <b id="m5">--</b></div>
  </div>
</div>

<div class="card">
  <div class="row"><span class="label">EMA20</span><b id="ema20">--</b></div>
  <div class="row"><span class="label">EMA75</span><b id="ema75">--</b></div>
  <div class="row"><span class="label">EMA200</span><b id="ema200">--</b></div>
  <div class="row"><span class="label">EMA200接近</span><b id="near">--</b></div>
  <div class="row"><span class="label">環境</span><b id="env">--</b></div>
</div>

<div class="card">
  <div class="row"><span class="label">1H Zone High</span><b id="zh">--</b></div>
  <div class="row"><span class="label">1H Zone Low</span><b id="zl">--</b></div>
  <div class="row"><span class="label">受信時刻</span><b id="received">--</b></div>
</div>

<div class="small">10秒ごとに自動更新</div>
</main>
<script>
const API="https://xauusd-judge-webhook.stmm-casting92.workers.dev/";
const $=id=>document.getElementById(id);
const val=v=>(v===undefined||v===null||v==="")?"--":v;
function dir(id,v){
  const e=$(id), s=String(v||"").toUpperCase();
  e.textContent=s||"--";
  e.className=s==="UP"?"up":s==="DOWN"?"down":"flat";
}
function fmt(v){
  const n=Number(v); return Number.isFinite(n)?n.toFixed(2):val(v);
}
async function refresh(){
  try {
    const r=await fetch(API+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json(), d=j.latest||j;
    $("price").textContent=fmt(d.price);
    const judge=String(d.judge||"WAIT").toUpperCase();
    $("judge").textContent=judge;
    $("judge").className="judge "+(judge==="LONG"?"long":judge==="SHORT"?"short":"wait");
    $("reason").textContent=d.reason||"判定待ち";
    dir("h4",d["4h"]); dir("h1",d["1h"]); dir("m15",d["15m"]); dir("m5",d["5m"]);
    $("ema20").textContent=fmt(d.ema20); $("ema75").textContent=fmt(d.ema75); $("ema200").textContent=fmt(d.ema200);
    $("near").textContent=val(d.near_ema200); dir("env",d.environment);
    $("zh").textContent=val(d.zone_high_1h); $("zl").textContent=val(d.zone_low_1h);
    $("received").textContent=d.received_at?new Date(d.received_at).toLocaleTimeString("ja-JP"): "--";
    $("updated").textContent="画面更新 "+new Date().toLocaleTimeString("ja-JP");
    $("live").textContent="LIVE"; $("dot").className="dot";
  } catch(e) {
    $("live").textContent="CONNECTION ERROR"; $("dot").className="dot err";
    $("updated").textContent=String(e);
  }
}
refresh(); setInterval(refresh,10000);
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script></body></html>
